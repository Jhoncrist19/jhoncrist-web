<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JhonCrist | Mis Redes</title>

    <!-- LOGOS DE REDES SOCIALES -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ==============================
           FONDO DE LA PÁGINA
           ============================== */

        body {
            min-height: 100vh;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background-image: url("jhon.jpg.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: white;
        }


        /* ==============================
           CUADRO PRINCIPAL
           ============================== */

        .contenedor {

            text-align: center;

            padding: 40px;

            width: 90%;

            max-width: 500px;

            background: rgba(0, 0, 0, 0.45);

            border: 1px solid rgba(255, 255, 255, 0.3);

            border-radius: 25px;

            backdrop-filter: blur(8px);

            -webkit-backdrop-filter: blur(8px);

            box-shadow: 0 0 35px rgba(0, 0, 0, 0.7);
        }


        /* ==============================
           FOTO DE PERFIL
           ============================== */

        .perfil {

            width: 130px;

            height: 130px;

            margin: auto;

            border-radius: 50%;

            overflow: hidden;

            border: 3px solid white;

            box-shadow:
                0 0 15px white,
                0 0 30px #8a2be2;
        }


        .perfil img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;
        }


        /* ==============================
           TITULO
           ============================== */

        h1 {

            margin-top: 20px;

            font-size: 32px;

            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }


        p {

            margin: 10px 0 30px;

            color: #eeeeee;

            font-size: 16px;
        }


        /* ==============================
           REDES
           ============================== */

        .redes {

            display: flex;

            flex-direction: column;

            gap: 15px;
        }


        /* ==============================
           BOTONES
           ============================== */

        .boton {

            text-decoration: none;

            color: white;

            padding: 15px 20px;

            border-radius: 14px;

            font-size: 18px;

            font-weight: bold;

            transition: all 0.3s ease;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            border: 1px solid rgba(255,255,255,0.25);

            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }


        /* TAMAÑO DE LOS LOGOS */

        .boton i {

            font-size: 23px;
        }


        /* ==============================
           COLORES
           ============================== */

        .facebook {

            background: #1877f2;
        }


        .youtube {

            background: #ff0000;
        }


        .tiktok {

            background: #111111;
        }


        .instagram {

            background: linear-gradient(
                45deg,
                #feda75,
                #d62976,
                #962fbf,
                #4f5bd5
            );
        }


        /* ==============================
           ANIMACIÓN
           ============================== */

        .boton:hover {

            transform: translateY(-4px) scale(1.03);

            box-shadow:
                0 0 15px rgba(255,255,255,0.6),
                0 8px 20px rgba(0,0,0,0.4);
        }


        .boton:active {

            transform: scale(0.97);
        }


        /* ==============================
           PIE DE PÁGINA
           ============================== */

        footer {

            margin-top: 30px;

            color: #cccccc;

            font-size: 13px;
        }


        /* ==============================
           CELULARES
           ============================== */

        @media (max-width: 500px) {

            .contenedor {

                padding: 30px 20px;

            }

            h1 {

                font-size: 27px;

            }

        }

    </style>

</head>


<body>


    <div class="contenedor">


        <!-- ==============================
             FOTO DE PERFIL
             ============================== -->

        <div class="perfil">

            <img src="jhon1.jpg" alt="Foto de perfil">

        </div>


        <!-- ==============================
             TITULO
             ============================== -->

        <h1>

            JHON CRIST OFICIAL

        </h1>


        <p>

            ✨ Sígueme en mis redes sociales ✨

        </p>


        <!-- ==============================
             BOTONES
             ============================== -->

        <div class="redes">


            <!-- FACEBOOK -->

            <a
                class="boton facebook"
                href="https://www.facebook.com/share/1CTFR37ssh/"
                target="_blank"
            >

                <i class="fa-brands fa-facebook"></i>

                Facebook

            </a>


            <!-- YOUTUBE -->

            <a
                class="boton youtube"
                href="https://www.youtube.com/channel/UCgz7HXH8F7zcUtXH7Q45_nQ"
                target="_blank"
            >

                <i class="fa-brands fa-youtube"></i>

                YouTube

            </a>


            <!-- TIKTOK -->

            <a
                class="boton tiktok"
                href="https://www.tiktok.com/@jhoncrist_oficial?_r=1&_t=ZS-991i86rOWRu"
                target="_blank"
            >

                <i class="fa-brands fa-tiktok"></i>

                TikTok

            </a>


            <!-- INSTAGRAM -->

            <a
                class="boton instagram"
                href="https://www.instagram.com/jhoncrist_oficial?igsh=cDFhcmZpcXNsdHRi"
                target="_blank"
            >

                <i class="fa-brands fa-instagram"></i>

                Instagram

            </a>


        </div>


        <!-- ==============================
             PIE DE PÁGINA
             ============================== -->

        <footer>

            © 2026 - JhonCrist

        </footer>


    </div>


</body>

</html>
